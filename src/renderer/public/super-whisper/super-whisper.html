<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Whisper - Organon</title>
  <link rel="icon" type="image/png" href="tray-icon.png">
  <link rel="stylesheet" href="super-whisper.css">
</head>
<body>
  <div class="sw-app">
    <!-- Header (padrão view-header) -->
    <header class="sw-header">
      <div class="sw-header-left">
        <svg class="sw-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
        <div class="sw-header-text">
          <h1 class="sw-header-title">Super Whisper</h1>
          <span class="sw-header-subtitle" id="statusText">Pronto para gravar (R)</span>
        </div>
      </div>
      <button class="sw-close" id="closeBtn" title="Fechar (Esc)" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </header>

    <!-- Status indicator (pill) -->
    <div class="sw-status">
      <span class="sw-status-dot" id="statusDot" data-state="ready"></span>
      <span class="sw-status-message" id="statusMessage">Pronto</span>
      <span class="sw-status-timer" id="timer">00:00</span>
    </div>

    <!-- Waveform -->
    <div class="sw-waveform" id="waveform" aria-hidden="true">
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
      <div class="sw-waveform-bar"></div>
    </div>

    <!-- Transcrição atual -->
    <div class="sw-transcription">
      <div class="sw-transcription-header">
        <span>Transcrição atual</span>
        <span class="sw-char-count" id="charCount">0 caracteres</span>
      </div>
      <textarea
        id="transcriptionText"
        placeholder="Sua voz será transcrita aqui em tempo real..."
        spellcheck="false"
        readonly
      ></textarea>
    </div>

    <!-- Toolbar de ações -->
    <div class="sw-toolbar">
      <button class="sw-btn sw-btn-primary" id="recordBtn" title="Gravar (R)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
        <span id="recordBtnText">Gravar</span>
      </button>

      <button class="sw-btn" id="sendBtn" disabled title="Enviar para IA (Enter)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
        <span>Enviar</span>
      </button>

      <button class="sw-btn" id="copyBtn" disabled title="Copiar (C)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span>Copiar</span>
      </button>

      <button class="sw-btn" id="clearBtn" title="Limpar (Esc quando parado)">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
        <span>Limpar</span>
      </button>
    </div>

    <!-- Histórico colapsável -->
    <details class="sw-history" id="historyDetails">
      <summary class="sw-history-summary">
        <span>Histórico</span>
        <span class="sw-history-count" id="historyCount">0</span>
      </summary>
      <div class="sw-history-list" id="historyList">
        <div class="sw-history-empty">Nenhuma transcrição salva ainda</div>
      </div>
    </details>

    <!-- Hint -->
    <div class="sw-hint">
      <kbd>R</kbd> Gravar
      <kbd>Enter</kbd> Enviar
      <kbd>C</kbd> Copiar
      <kbd>Esc</kbd> Fechar
    </div>
  </div>

  <script src="super-whisper.js"></script>
</body>
</html>
